{% extends 'base.html' %}
{% block title %}Login - InterviewAI{% endblock %}
{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <h2>🧠 Welcome Back</h2>
        <p class="auth-sub">Login to continue your interview prep</p>
        <form method="post">
            {% csrf_token %}
            <div class="form-group"><label>Username</label><input type="text" name="username" required autofocus class="form-input"></div>
            <div class="form-group"><label>Password</label><input type="password" name="password" required class="form-input"></div>
            <button type="submit" class="btn-primary btn-full">Login →</button>
        </form>
        <p class="auth-link">Don't have an account? <a href="{% url 'register' %}">Register here</a></p>
    </div>
</div>
{% endblock %}
